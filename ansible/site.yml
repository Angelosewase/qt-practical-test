---
# Task 1 access, then Task 3 cluster. Run with: make ansible-run
- name: Set the devops password and SSH access on every VM
  hosts: all
  tags: [vm_access]
  roles:
    - vm_access

- name: Prepare every Kubernetes node
  hosts: k8s_cluster
  become: true
  roles:
    - common
    - kubernetes_prereqs
    - containerd
    - kubernetes_packages

- name: Initialise the control plane and install Flannel
  hosts: k8s_master
  become: true
  roles:
    - k8s_control_plane

- name: Join the workers
  hosts: k8s_workers
  become: true
  roles:
    - k8s_worker

- name: Verify the cluster
  hosts: k8s_master
  roles:
    - k8s_verify

- name: Docker host and the compose stack (Task 2)
  hosts: docker_host
  become: true
  roles:
    - docker_host
    - compose_app
