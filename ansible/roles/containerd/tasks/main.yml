---
- name: Install containerd
  ansible.builtin.apt:
    name: containerd
    state: present

- name: Create containerd config directory
  ansible.builtin.file:
    path: /etc/containerd
    state: directory
    mode: "0755"

- name: Generate the default containerd configuration
  ansible.builtin.shell: containerd config default > /etc/containerd/config.toml
  args:
    creates: /etc/containerd/config.toml

# Check mode does not run the shell task above, so the file would not exist yet.
- name: Use systemd cgroup driver (required by kubelet)
  ansible.builtin.replace:
    path: /etc/containerd/config.toml
    regexp: 'SystemdCgroup = false'
    replace: 'SystemdCgroup = true'
  notify: Restart containerd
  when: not ansible_check_mode

- name: Verify the systemd cgroup driver is enabled
  ansible.builtin.command: grep -q 'SystemdCgroup = true' /etc/containerd/config.toml
  changed_when: false
  when: not ansible_check_mode

- name: Enable and start containerd
  ansible.builtin.systemd:
    name: containerd
    enabled: true
    state: started
  when: not ansible_check_mode
