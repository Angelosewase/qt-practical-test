---
- name: Install containerd
  ansible.builtin.apt:
    name: containerd
    state: present

- name: Create containerd config directory
  ansible.builtin.file:
    path: /etc/containerd
    state: directory
    mode: "0755"

# Kali's package ships a minimal config.toml, so a "creates:" guard would keep it and skip the full defaults.
# The full default config is written with the systemd cgroup driver, and replaced only when it differs.
# Check mode skips this task, because containerd is not installed yet at that point.
- name: Write the full containerd config with the systemd cgroup driver (kubelet requires it)
  ansible.builtin.shell: |
    set -o pipefail
    containerd config default | sed 's/SystemdCgroup = false/SystemdCgroup = true/' > /etc/containerd/config.toml.new
    if cmp -s /etc/containerd/config.toml.new /etc/containerd/config.toml; then
      rm -f /etc/containerd/config.toml.new
      echo UNCHANGED
    else
      mv /etc/containerd/config.toml.new /etc/containerd/config.toml
      echo CHANGED
    fi
  args:
    executable: /bin/bash
  register: containerd_config
  # Exact match on the last line: 'UNCHANGED' contains 'CHANGED', so a substring test would restart containerd on every run.
  changed_when: containerd_config.stdout_lines[-1] == 'CHANGED'
  notify: Restart containerd
  when: not ansible_check_mode

- name: Verify the systemd cgroup driver is enabled
  ansible.builtin.command: grep -q 'SystemdCgroup = true' /etc/containerd/config.toml
  changed_when: false
  when: not ansible_check_mode

- name: Enable and start containerd
  ansible.builtin.systemd:
    name: containerd
    enabled: true
    state: started
  when: not ansible_check_mode
