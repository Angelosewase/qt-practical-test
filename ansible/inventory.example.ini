# Template only. scripts/gen-inventory.sh writes the real ansible/inventory.ini from terraform output.
[docker_host]
c3-docker-host ansible_host=192.0.2.10

[k8s_master]
c3-k8s-master ansible_host=192.0.2.11

[k8s_workers]
c3-k8s-worker-1 ansible_host=192.0.2.12
c3-k8s-worker-2 ansible_host=192.0.2.13

[k8s_cluster:children]
k8s_master
k8s_workers

[all:vars]
ansible_user=devops
ansible_ssh_private_key_file=/absolute/path/to/.private/ssh/id_ed25519
