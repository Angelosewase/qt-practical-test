# Go API (ProjectHub backend). Images come from Docker Hub; __DOCKERHUB_USER__ and __API_TAG__ are
# filled in by scripts/k8s-render.sh from docker/.env. The "api" Service name is used by the gateway.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: qt-spring-app
  labels:
    app.kubernetes.io/name: api
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      annotations:
        # Rendered from k8s/10-config.yaml by scripts/k8s-render.sh: a config change rolls these pods.
        checksum/config: "__CONFIG_HASH__"
      labels:
        app.kubernetes.io/name: api
    spec:
      automountServiceAccountToken: false
      # The API exits after MONGO_CONNECT_TIMEOUT if MongoDB is not up yet. This init container waits for the port,
      # so a slow MongoDB start does not cause API restarts. The API still retries its own connection.
      initContainers:
        - name: wait-for-mongodb
          image: alpine:3.21.10
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "until nc -z mongodb 27017; do echo waiting for mongodb; sleep 2; done"]
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 32Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: __DOCKERHUB_USER__/projecthub-api:__API_TAG__
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: api-config
          env:
            - name: MONGO_HOST
              valueFrom:
                configMapKeyRef: {name: api-config, key: MONGO_HOST}
            - name: MONGO_ROOT_USER
              valueFrom:
                secretKeyRef: {name: app-secrets, key: MONGO_ROOT_USER}
            - name: MONGO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: {name: app-secrets, key: MONGO_ROOT_PASSWORD}
            # Built at start from the pieces above. Kubernetes expands $(VAR) from earlier env entries.
            - name: MONGO_URI
              value: "mongodb://$(MONGO_ROOT_USER):$(MONGO_ROOT_PASSWORD)@$(MONGO_HOST)/?authSource=admin"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef: {name: app-secrets, key: JWT_SECRET}
            - name: VALKEY_PASSWORD
              valueFrom:
                secretKeyRef: {name: app-secrets, key: VALKEY_PASSWORD}
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # Liveness uses the same endpoint with a longer window: a MongoDB outage should not restart the API in a loop.
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: qt-spring-app
  labels:
    app.kubernetes.io/name: api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: api
  ports:
    - name: http
      port: 8080
      targetPort: http
