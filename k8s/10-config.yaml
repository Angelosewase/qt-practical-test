# Non-secret configuration. Secrets live in the app-secrets Secret (see secret.example.yaml).
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
  namespace: qt-spring-app
data:
  PORT: "8080"
  GIN_MODE: release
  # Host and port only. The API builds MONGO_URI from this plus the credentials in app-secrets.
  MONGO_HOST: mongodb:27017
  MONGO_DB: projecthub
  MONGO_CONNECT_TIMEOUT: 60s
  JWT_EXPIRES_IN: 24h
  # Test accounts for the examiners (see README). Set to "false" to disable.
  SEED_ENABLED: "true"
  CACHE_ENABLED: "true"
  # Explicit browser origins allowed to call the API (the check stays on; no wildcard).
  # Must match exactly what the browser sends: scheme, host and port of the page. Covers the Compose URL
  # the NodePort on all three node IPs, and the Gateway API NodePort 30090 (bonus). Without these the API answers 403 to the login POST (see D-CORS-1).
  CORS_ORIGINS: "http://192.168.160.11,http://192.168.160.17:30080,http://192.168.160.33:30080,http://192.168.160.98:30080,http://192.168.160.17:30090,http://192.168.160.33:30090,http://192.168.160.98:30090"
  VALKEY_ADDR: valkey:6379
  VALKEY_DB: "0"
  CACHE_STATS_TTL: 2m
  CACHE_USER_TTL: 1m
---
# Same routing as docker/nginx.conf. Differences: the resolver is Kubernetes DNS, and upstreams are fully
# qualified, because nginx's resolver does not apply the pod's search domains (a bare "frontend" never resolves).
apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-nginx
  namespace: qt-spring-app
data:
  default.conf: |
    resolver kube-dns.kube-system.svc.cluster.local valid=10s ipv6=off;

    server {
        listen 80;
        server_name _;
        server_tokens off;
        client_max_body_size 1m;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;

        location /api/ {
            set $api_upstream http://api.qt-spring-app.svc.cluster.local:8080;
            proxy_pass $api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            set $frontend_upstream http://frontend.qt-spring-app.svc.cluster.local:8080;
            proxy_pass $frontend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
