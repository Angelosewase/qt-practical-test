# Gateway API objects for ProjectHub. The listener port (8000) is Traefik's "web" entry point, which Traefik
# requires the listener port to match. NodePort 30090 (controller/service.yaml) reaches it from outside.
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: traefik
spec:
  controllerName: traefik.io/gateway-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: projecthub
  namespace: qt-spring-app
spec:
  gatewayClassName: traefik
  listeners:
    - name: http
      protocol: HTTP
      port: 8000
      allowedRoutes:
        namespaces:
          from: Same
---
# /api and everything below it goes to the Go API. Longest-prefix match wins over the "/" route.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: projecthub-api
  namespace: qt-spring-app
spec:
  parentRefs:
    - name: projecthub
  rules:
    - matches:
        - path: {type: PathPrefix, value: /api}
      backendRefs:
        - name: api
          port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: projecthub-frontend
  namespace: qt-spring-app
spec:
  parentRefs:
    - name: projecthub
  rules:
    - matches:
        - path: {type: PathPrefix, value: /}
      backendRefs:
        - name: frontend
          port: 8080
