# Exposes the Traefik "web" entry point (the Gateway listener) on every node: http://<node-ip>:30090
apiVersion: v1
kind: Service
metadata:
  name: traefik
  namespace: traefik-gateway
  labels:
    app.kubernetes.io/name: traefik
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: traefik
  ports:
    - name: web
      port: 8000
      targetPort: web
      nodePort: 30090
