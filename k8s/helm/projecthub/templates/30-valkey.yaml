# Valkey cache: optional for the API. No volume: it only holds data that MongoDB can rebuild.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "projecthub.labels" (dict "root" . "name" "valkey") | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: valkey
  template:
    metadata:
      labels:
        app.kubernetes.io/name: valkey
    spec:
      automountServiceAccountToken: false
      containers:
        - name: valkey
          image: {{ include "projecthub.image" .Values.images.valkey }}
          imagePullPolicy: IfNotPresent
          # The password comes from the environment at start, not from the chart.
          command: ["sh", "-c", "exec valkey-server --requirepass \"$VALKEY_PASSWORD\" --save '' --appendonly no"]
          ports:
            - name: valkey
              containerPort: 6379
          env:
            - name: VALKEY_PASSWORD
              valueFrom:
                secretKeyRef: {name: {{ .Values.existingSecret }}, key: VALKEY_PASSWORD}
            - name: REDISCLI_AUTH
              valueFrom:
                secretKeyRef: {name: {{ .Values.existingSecret }}, key: VALKEY_PASSWORD}
          # TCP probes, not exec (D-K8S-19).
          readinessProbe:
            tcpSocket:
              port: valkey
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: valkey
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources.valkey | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: valkey
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "projecthub.labels" (dict "root" . "name" "valkey") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: valkey
  ports:
    - name: valkey
      port: 6379
      targetPort: 6379
