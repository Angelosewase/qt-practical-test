# Entry point: nginx routes / to frontend and /api/ to api. NodePort {{ .Values.gateway.nodePort }} on every node.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "projecthub.labels" (dict "root" . "name" "gateway") | nindent 4 }}
spec:
  replicas: {{ .Values.replicas.gateway }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway
  template:
    metadata:
      annotations:
        checksum/config: {{ include "projecthub.configHash" . | quote }}
      labels:
        app.kubernetes.io/name: gateway
    spec:
      automountServiceAccountToken: false
      containers:
        - name: nginx
          image: {{ include "projecthub.image" .Values.images.gateway }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources.gateway | nindent 12 }}
          volumeMounts:
            - name: gateway-nginx
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
      volumes:
        - name: gateway-nginx
          configMap:
            name: gateway-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "projecthub.labels" (dict "root" . "name" "gateway") | nindent 4 }}
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: gateway
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: {{ .Values.gateway.nodePort }}
