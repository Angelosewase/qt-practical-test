# Go API (ProjectHub backend). The "api" Service name is used by the gateway.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "projecthub.labels" (dict "root" . "name" "api") | nindent 4 }}
spec:
  replicas: {{ .Values.replicas.api }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      annotations:
        checksum/config: {{ include "projecthub.configHash" . | quote }}
      labels:
        app.kubernetes.io/name: api
    spec:
      automountServiceAccountToken: false
      initContainers:
        - name: wait-for-mongodb
          image: {{ include "projecthub.image" .Values.images.waitForMongodb }}
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "until nc -z mongodb 27017; do echo waiting for mongodb; sleep 2; done"]
          resources:
            {{- toYaml .Values.resources.apiWaitForMongodb | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: {{ include "projecthub.image" .Values.images.api }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: api-config
          env:
            - name: MONGO_HOST
              valueFrom:
                configMapKeyRef: {name: api-config, key: MONGO_HOST}
            - name: MONGO_ROOT_USER
              valueFrom:
                secretKeyRef: {name: {{ .Values.existingSecret }}, key: MONGO_ROOT_USER}
            - name: MONGO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: {name: {{ .Values.existingSecret }}, key: MONGO_ROOT_PASSWORD}
            - name: MONGO_URI
              value: "mongodb://$(MONGO_ROOT_USER):$(MONGO_ROOT_PASSWORD)@$(MONGO_HOST)/?authSource=admin"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef: {name: {{ .Values.existingSecret }}, key: JWT_SECRET}
            - name: VALKEY_PASSWORD
              valueFrom:
                secretKeyRef: {name: {{ .Values.existingSecret }}, key: VALKEY_PASSWORD}
            - name: GOMEMLIMIT
              value: {{ .Values.api.goMemLimit | quote }}
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            {{- toYaml .Values.resources.api | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "projecthub.labels" (dict "root" . "name" "api") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: api
  ports:
    - name: http
      port: 8080
      targetPort: http
