# MongoDB: one replica on a local PersistentVolume pinned to the node labelled projecthub/storage=mongo.
# Label the node first: kubectl label node <node> projecthub/storage=mongo
apiVersion: v1
kind: PersistentVolume
metadata:
  name: projecthub-mongo-data
  labels:
    app.kubernetes.io/name: mongodb
spec:
  capacity:
    storage: 10Gi
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: projecthub-local
  hostPath:
    path: /srv/projecthub/mongo
    type: DirectoryOrCreate
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: projecthub/storage
              operator: In
              values: ["mongo"]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongo-data
  namespace: qt-spring-app
  labels:
    app.kubernetes.io/name: mongodb
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: projecthub-local
  volumeName: projecthub-mongo-data
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: qt-spring-app
  labels:
    app.kubernetes.io/name: mongodb
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mongodb
  ports:
    - name: mongo
      port: 27017
      targetPort: 27017
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  namespace: qt-spring-app
  labels:
    app.kubernetes.io/name: mongodb
spec:
  serviceName: mongodb
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mongodb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mongodb
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      initContainers:
        # hostPath directories are created root-owned; mongod runs as uid 999.
        - name: fix-data-dir
          image: mongo:7.0.14
          command: ["sh", "-c", "chown -R 999:999 /data/db"]
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: data
              mountPath: /data/db
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 100m, memory: 64Mi}
      containers:
        - name: mongodb
          image: mongo:7.0.14
          imagePullPolicy: IfNotPresent
          ports:
            - name: mongo
              containerPort: 27017
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef: {name: app-secrets, key: MONGO_ROOT_USER}
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: {name: app-secrets, key: MONGO_ROOT_PASSWORD}
          volumeMounts:
            - name: data
              mountPath: /data/db
          readinessProbe:
            exec:
              command: ["mongosh", "--quiet", "--norc", "--eval", "db.adminCommand({ping: 1}).ok"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command: ["mongosh", "--quiet", "--norc", "--eval", "db.adminCommand({ping: 1}).ok"]
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "1", memory: 1Gi}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mongo-data
