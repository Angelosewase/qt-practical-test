# Entry point. NGINX routes / to frontend and /api/ to api, exactly as in docker/nginx.conf.
# NodePort 30080 exposes it on every node: http://<node-ip>:30080
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: qt-spring-app
  labels:
    app.kubernetes.io/name: gateway
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway
  template:
    metadata:
      annotations:
        # Rendered from k8s/10-config.yaml by scripts/k8s-render.sh: a config change rolls these pods.
        checksum/config: "__CONFIG_HASH__"
      labels:
        app.kubernetes.io/name: gateway
    spec:
      automountServiceAccountToken: false
      containers:
        - name: nginx
          image: nginx:1.27.5-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 200m, memory: 128Mi}
          volumeMounts:
            - name: gateway-nginx
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
      volumes:
        - name: gateway-nginx
          configMap:
            name: gateway-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: qt-spring-app
  labels:
    app.kubernetes.io/name: gateway
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: gateway
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
