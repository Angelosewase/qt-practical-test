# TEMPLATE ONLY. Never apply this file with real values.
# The real Secret is created from docker/.env at deploy time by scripts/k8s-secrets.sh:
#   make k8s-secrets   (values are passed through a temporary file, never printed or committed)
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: qt-spring-app
  labels:
    app.kubernetes.io/part-of: projecthub
type: Opaque
stringData:
  MONGO_ROOT_USER: projecthub
  MONGO_ROOT_PASSWORD: change-me
  VALKEY_PASSWORD: change-me
  # At least 32 characters. Generate: openssl rand -hex 32
  JWT_SECRET: change-me-to-at-least-32-random-characters
